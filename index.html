<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechWave Podcast</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#12051f] text-white">
  <header class="border-b border-white/10 bg-[#160724]">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-5 md:px-8">
      <a href="#" class="text-2xl font-extrabold tracking-tight md:text-3xl">
        Tech<span class="bg-gradient-to-r from-[#ff2ccf] to-[#8d00ff] bg-clip-text text-transparent">Wave</span>
      </a>

      <ul class="hidden items-center gap-10 text-sm font-semibold text-white/70 md:flex">
        <li><a class="transition hover:text-white" href="#about">About</a></li>
        <li><a class="transition hover:text-white" href="#episodes">Episodes</a></li>
        <li><a class="transition hover:text-white" href="#host">Host</a></li>
      </ul>

      <a href="#subscribe" class="hidden rounded-full bg-gradient-to-r from-[#ffe640] via-[#ff2ccf] to-[#8d00ff] px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-fuchsia-500/25 transition hover:-translate-y-0.5 hover:shadow-fuchsia-500/40 md:inline-flex">
        Subscribe &rarr;
      </a>

      <button class="md:hidden" aria-label="Open menu">
        <img src="assets/hamburger-menu.png" alt="" class="h-4 w-5">
      </button>
    </nav>
  </header>

  <main>
    <section class="relative overflow-hidden bg-[#160724]">
      <div class="absolute inset-x-0 top-12 hidden h-[380px] bg-[url('assets/hero-bg.png')] bg-cover bg-center opacity-90 md:block"></div>
      <div class="absolute inset-x-0 top-10 h-52 bg-[url('assets/hero-bg.png')] bg-cover bg-center opacity-80 md:hidden"></div>

      <div class="relative mx-auto flex min-h-[560px] max-w-6xl flex-col items-center justify-center px-5 pb-20 pt-12 text-center md:min-h-[650px] md:px-8 md:pt-20">
        <div class="relative mb-8">
          <img src="assets/hero-circle.png" alt="TechWave podcast" class="h-48 w-48 drop-shadow-[0_0_35px_rgba(180,0,255,0.45)] md:h-72 md:w-72">
          <span class="absolute right-0 top-2 rounded-full bg-[#00ff8b] px-4 py-1.5 text-xs font-extrabold text-[#071e18] shadow-lg shadow-emerald-400/40 md:right-1 md:top-4">
            NEW
          </span>
        </div>

        <h1 class="text-4xl font-extrabold tracking-tight md:text-6xl">TechWave</h1>
        <p class="mt-4 max-w-xl text-sm leading-6 text-white/65 md:text-base">
          Your daily dose of tech insights, productivity hacks, and personal growth.
        </p>

        <div class="mt-7 flex flex-wrap items-center justify-center gap-3">
          <a href="#episodes" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-[#ffe640] via-[#ff2ccf] to-[#a100ff] px-5 py-3 text-sm font-bold text-white shadow-lg shadow-fuchsia-500/25 transition hover:-translate-y-0.5">
            <img src="assets/spotify.png" alt="" class="h-4 w-4">
            Listen On Spotify
          </a>
          <a href="#subscribe" class="inline-flex items-center gap-2 rounded-full border border-[#00ff8b] px-5 py-3 text-sm font-bold text-[#00ff8b] transition hover:-translate-y-0.5 hover:bg-[#00ff8b] hover:text-[#12051f]">
            <img src="assets/message.png" alt="" class="h-3.5 w-4">
            Subscribe
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
